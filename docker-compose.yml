version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lingopika
      POSTGRES_PASSWORD: lingopika
      POSTGRES_DB: lingopika
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
  bot:
    build: ./backend
    command: python run_bot.py
    env_file: .env
    depends_on:
      - backend
volumes:
  pgdata:
